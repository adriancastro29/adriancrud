{% extends 'app/base.html' %}

{% block content %}
<h1>Confirm Delete</h1>

<p>
    Are you sure you want to delete
    "<strong>{{ object.name }}</strong>"?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'medicine_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
