<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>GabayGamot</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>

{% include 'app/navbar.html' %}

<!-- ✅ ORDER / SYSTEM MESSAGES -->
{% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert {{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

{% block content %}
{% endblock content %}

<script src="{% static 'js/base.js' %}"></script>
</body>
</html>
