<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>GabayGamot</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>

{% include 'app/navbar.html' %}

<!-- ✅ ORDER / SYSTEM MESSAGES -->
{% if messages %}
  <div style="max-width: 1100px; margin: 10px auto;">
    {% for message in messages %}
      <div style="
        padding: 10px 15px;
        margin-bottom: 10px;
        border-radius: 6px;
        background-color: #ffe6e6;
        color: #800000;
        border: 1px solid #800000;
      ">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}


{% block content %}
{% endblock content %}

<script src="{% static 'js/base.js' %}"></script>
</body>
</html>
